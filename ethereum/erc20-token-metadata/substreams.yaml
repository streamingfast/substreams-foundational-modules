specVersion: v0.1.0
package:
  name: erc20-token-metadata
  version: v0.2.0
  description: ERC20 Token metadata module for Foundational Store
  url: https://github.com/streamingfast/substreams-foundational-modules/tree/develop/ethereum/erc20-token-metadata

imports:
  erc20_metadata: https://github.com/pinax-network/substreams-evm-tokens/releases/download/erc20-metadata-v0.2.1/evm-erc20-metadata-v0.2.1.spkg

binaries:
  default:
    type: wasm/rust-v1
    file: ../../target/wasm32-unknown-unknown/release/erc20_token_metadata.wasm

protobuf:
  files:
    - sf/substreams/ethereum/erc20/v1/token_metadata.proto
  descriptorSets:
    - module: buf.build/streamingfast/substreams-foundational-store
  importPaths:
    - ./proto
  excludePaths:
    - evm
    - google
    - sf/substreams/v1
    - sf/substreams/sink
    - sf/substreams/rpc
    - sf/substreams/index

modules:
  - name: metadata_to_foundational_store
    kind: map
    doc: Convert ERC20 Token metadata to Foundational Store format
    inputs:
      - map: erc20_metadata:map_events
    output:
      type: proto:sf.substreams.foundational_store.model.v2.SinkEntries

network: mainnet
