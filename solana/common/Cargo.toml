[package]
name = "solana-common"
version = "0.1.0"
description = "Substreams showcasing the building blocks of Solana"
repository = "https://github.com/streamingfast/substreams-foundational-modules/solana-common"
edition.workspace = true
homepage.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = { workspace = true }
bs58 = { workspace = true }
num-bigint = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
substreams = { workspace = true }
substreams-solana = "^0.14.3"

[dev-dependencies]
testing = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }
dhat = "0.3"

[[bench]]
name = "solana_common_benchmarks"
harness = false

[[bench]]
name = "memory_benchmarks"
harness = false

[[bench]]
name = "criterion_with_alloc_counter"
harness = false
