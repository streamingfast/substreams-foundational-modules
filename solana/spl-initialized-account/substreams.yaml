specVersion: v0.1.0
package:
  name: spl-initialized-account
  version: v0.1.2
  description: Substreams module tracks SPL token account initializations on Solana and allow Foundational Store queries on it
  url: https://github.com/streamingfast/substreams-foundational-modules/tree/develop/solana/spl-initialized-account#solana-spl-initialized-account-foundational-store
  image: solana.png

network: solana

imports:
  solana_common: solana-common@v0.3.0

protobuf:
  files:
    - sf/substreams/solana/spl/v1/initialized_account.proto
  descriptorSets:
    - module: buf.build/streamingfast/substreams-foundational-store
  excludePaths:
   - google
   - sf/firehose/
   - solana.proto
   - sf/solana/type
   - sf/substreams/index
   - sf/substreams/internal
   - sf/substreams/options.proto
   - sf/substreams/rpc
   - sf/substreams/sink
   - sf/substreams/v1
   - instructions.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1+wasm-bindgen-shims
    file: ../../target/wasm32-unknown-unknown/release/spl_initialized_account.wasm

modules:
  - name: map_spl_initialized_account
    kind: map
    initialBlock: 31310775
    inputs:
      - params: string
      - map: solana_common:transactions_by_programid_without_votes
    output:
        type: proto:sf.substreams.foundational_store.v1.Entries

params:
  solana_common:transactions_by_programid_without_votes: "program:TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA || program:TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb"
