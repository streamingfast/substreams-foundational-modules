specVersion: v0.1.0
package:
  name: solana_accounts_foundational
  version: v0.1.1
  url: https://github.com/streamingfast/substreams-foundational-modules
  image: solana.png
  description: Foundational (common) module for fetching solana account changes

imports:
  solana_common: https://github.com/streamingfast/substreams-foundational-modules/releases/download/solana-common-v0.3.0/solana-common-v0.3.0.spkg

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/solana_accounts_common.wasm

network: solana-accounts-mainnet

protobuf:
  files:
    - type/v1/type.proto
    - spl/v1/initialized_account.proto
  descriptorSets:
    - localPath: ./descriptors/firehose-solana.binpb
    - localPath: ./descriptors/substreams.binpb
  excludePaths:
    - google
    - sf/substreams/internal
    - sf/substreams/rpc
    - sf/substreams/sink
    - sf/substreams/v1
    - sf/firehose/
  importPaths:
    - ./proto/sf/substreams/solana

modules:
  - name: index_accounts
    kind: blockIndex
    inputs:
      - source: sf.solana.type.v1.AccountBlock
    output:
      type: proto:sf.substreams.index.v1.Keys
    doc: |
      `index_accounts` will index the accounts by their address and owner as given in the account block
      ex: `account:AwjomjhbNqkgEZN1ADvbEcTYsDfBuX4AKzNmxwgtKvxM`, `owner:stk17KkSJ7amyTVpGBHgo3Kcz52GjkzKYXuDwsFSk95`

  - name: filtered_accounts
    kind: map
    blockFilter:
      module: index_accounts
      query:
        params: true
    inputs:
      - params: string
      - source: sf.solana.type.v1.AccountBlock
    output:
      type: proto:sf.substreams.solana.type.v1.FilteredAccounts

params: # Default parameters. You can override these parameters based on your needs.
  filtered_accounts: "owner:TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"
